<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Operations</title>
    <style>
      :root {
        --bg: #edf4ff;
        --sidebar: #0b1220;
        --panel: rgba(255,255,255,0.82);
        --muted: #5f6f8d;
        --text: #111827;
        --heading: #0f172a;
        --accent: #2bb4a3;
        --accent-2: #4f7cff;
        --warning: #ffb648;
        --danger: #f26a6a;
        --border: rgba(15, 23, 42, 0.08);
        --shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #edf4ff 0%, #f8faff 100%);
      }
      .shell { display: flex; min-height: 100vh; }
      .sidebar {
        width: 260px; background: linear-gradient(180deg, #0b1220 0%, #101b2d 100%); color: #edf5ff; border-right: 1px solid rgba(255,255,255,0.06); padding: 28px 18px;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 30px; padding: 4px 8px 18px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06131b; font-weight: 900; }
      nav { display: flex; flex-direction: column; gap: 10px; }
      .nav-item {
        text-decoration: none; color: rgba(255,255,255,0.75); border: 1px solid transparent; background: rgba(255,255,255,0.02); padding: 12px 14px; border-radius: 12px; display: block; transition: all 0.2s ease; font-weight: 600;
      }
      .nav-item.active { background: linear-gradient(90deg, rgba(79,124,255,0.18), rgba(43,180,163,0.14)); border-color: rgba(127, 186, 255, 0.3); color: #f5f9ff; }
      .content { flex: 1; padding: 32px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      .topbar-actions { display: flex; align-items: center; gap: 12px; }
      .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
      .title { font-size: clamp(1.8rem, 2.5vw, 2.5rem); letter-spacing: -0.05em; margin: 0; color: var(--heading); }
      .chip { border: 1px solid var(--border); background: rgba(255,255,255,0.6); padding: 9px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; }
      .logout { background: #ffffff; border: 1px solid var(--border); color: var(--text); padding: 11px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; box-shadow: 0 10px 24px rgba(15,23,42,0.04); }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px; margin-bottom: 20px; }
      .stat-card, .panel, .table-card { background: var(--panel); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow); }
      .stat-card { padding: 18px; }
      .stat-title { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
      .stat-value { font-size: clamp(1.7rem, 2vw, 2.3rem); font-weight: 800; margin-top: 10px; letter-spacing: -0.05em; }
      .section-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
      .panel, .table-card { padding: 20px 18px; }
      .panel-header, .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .panel-header h3, .table-header h3 { margin: 0; font-size: 1.1rem; }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .mini-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
      .mini-row:last-child { border-bottom: none; }
      .muted { color: var(--muted); }
      .status-badge { border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; display: inline-block; }
      .approved { background: rgba(43,180,163,0.12); color: #0d9d86; }
      .pending { background: rgba(255,182,72,0.14); color: #c78410; }
      .rejected { background: rgba(242,106,106,0.12); color: #d64747; }
      .active { background: rgba(79,124,255,0.12); color: #315de3; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
      tbody tr:hover { background: rgba(79,124,255,0.02); }
      .status-select, .wallet-action {
        border: 1px solid var(--border);
        background: #f8fbff;
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        color: var(--heading);
      }
      .mini-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      @media (max-width: 900px) { .shell { flex-direction: column; } .sidebar { width: 100%; } .content { padding: 20px 16px 28px; } .section-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">L</div> Laundry Ops</div>
        <nav>
          <a class="nav-item" href="/dashboard">Overview</a>
          <a class="nav-item" href="/kyc">KYC</a>
          <a class="nav-item" href="/orders">Orders</a>
          <a class="nav-item" href="/wallets">Wallets</a>
          <a class="nav-item active" href="/vendors">Vendors</a>
          <a class="nav-item" href="/drivers">Drivers</a>
          <a class="nav-item" href="/payouts">Payouts</a>
        </nav>
      </aside>
      <main class="content">
        <div class="topbar">
          <div>
            <div class="eyebrow">Operations</div>
            <h1 class="title">Vendor operations</h1>
          </div>
          <div class="topbar-actions">
            <div class="chip" id="adminLabel">Admin</div>
            <button class="logout" id="logoutBtn">Logout</button>
          </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="section-grid">
          <div class="panel">
            <div class="panel-header"><h3>Vendor activity</h3></div>
            <div class="list" id="vendorActivity"></div>
          </div>
          <div class="panel">
            <div class="panel-header"><h3>KYC pipeline</h3></div>
            <div class="list" id="kycPipeline"></div>
          </div>
        </div>

        <div class="table-card">
          <div class="table-header"><h3>Vendors</h3></div>
          <table>
            <thead>
              <tr><th>Name</th><th>Status</th><th>KYC</th><th>Wallet</th><th>Action</th><th>Updated</th></tr>
            </thead>
            <tbody id="vendorBody"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:4001';
      const token = localStorage.getItem('laundry-admin-token');
      if (!token) window.location.href = '/login';

      function formatMoney(cents) { return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format((cents || 0) / 100); }
      function formatDate(value) { return new Date(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }

      function renderStats(vendors, orders) {
        const active = vendors.filter(v => v.status === 'active').length;
        const review = vendors.filter(v => v.status === 'review').length;
        const kycPending = vendors.filter(v => v.kycStatus === 'pending').length;
        const vendorRevenue = orders.filter(o => o.vendorName).reduce((sum, order) => sum + Number(order.totalCents || 0), 0);

        const stats = [
          { title: 'Active vendors', value: active },
          { title: 'Review queue', value: review },
          { title: 'KYC pending', value: kycPending },
          { title: 'Revenue tracked', value: formatMoney(vendorRevenue) }
        ];

        document.getElementById('statsGrid').innerHTML = stats.map(stat => `
          <div class="stat-card">
            <div class="stat-title">${stat.title}</div>
            <div class="stat-value">${stat.value}</div>
          </div>
        `).join('');
      }

      function renderActivity(vendors, payouts) {
        const list = vendors.slice(0, 4).map(vendor => {
          const payout = payouts.find(item => item.vendorName === vendor.name) || { status: 'pending', amountCents: 0 };
          return `
            <div class="mini-row">
              <div>
                <strong>${vendor.name}</strong>
                <div class="muted">${vendor.email}</div>
              </div>
              <div style="text-align:right;">
                <div>${formatMoney(payout.amountCents || 0)}</div>
                <span class="status-badge ${payout.status === 'paid' ? 'approved' : payout.status === 'processing' ? 'active' : 'pending'}">${payout.status}</span>
              </div>
            </div>
          `;
        });
        document.getElementById('vendorActivity').innerHTML = list.join('');

        const kycCounts = { approved: 0, pending: 0, rejected: 0 };
        vendors.forEach(item => { if (kycCounts[item.kycStatus] !== undefined) kycCounts[item.kycStatus]++; });
        document.getElementById('kycPipeline').innerHTML = ['approved','pending','rejected'].map(key => `
          <div class="mini-row">
            <div><strong>${key}</strong></div>
            <span class="status-badge ${key === 'approved' ? 'approved' : key === 'pending' ? 'pending' : 'rejected'}">${kycCounts[key]}</span>
          </div>
        `).join('');
      }

      function renderVendors(vendors) {
        document.getElementById('vendorBody').innerHTML = vendors.map(vendor => `
          <tr>
            <td>${vendor.name}</td>
            <td><span class="status-badge ${vendor.status === 'active' ? 'active' : vendor.status === 'review' ? 'pending' : 'rejected'}">${vendor.status}</span></td>
            <td><span class="status-badge ${vendor.kycStatus === 'approved' ? 'approved' : vendor.kycStatus === 'rejected' ? 'rejected' : 'pending'}">${vendor.kycStatus}</span></td>
            <td>${formatMoney(vendor.walletBalanceCents || 0)}</td>
            <td>
              <div class="mini-stack">
                <select class="status-select" data-user-id="${vendor.id}">
                  <option value="active" ${vendor.status === 'active' ? 'selected' : ''}>active</option>
                  <option value="review" ${vendor.status === 'review' ? 'selected' : ''}>review</option>
                  <option value="inactive" ${vendor.status === 'inactive' ? 'selected' : ''}>inactive</option>
                </select>
                <button class="small-btn update-user-status" data-id="${vendor.id}">Save status</button>
                <button class="wallet-action" data-id="${vendor.id}" data-kind="topup">+250</button>
                <button class="wallet-action" data-id="${vendor.id}" data-kind="refund">-250</button>
              </div>
            </td>
            <td>${formatDate(vendor.updatedAt)}</td>
          </tr>
        `).join('');

        document.querySelectorAll('.update-user-status').forEach(button => {
          button.addEventListener('click', async () => {
            const select = document.querySelector(`.status-select[data-user-id="${button.dataset.id}"]`);
            await fetch(`${API_BASE}/api/admin/users/${button.dataset.id}/status`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify({ status: select.value })
            });
            loadPage();
          });
        });

        document.querySelectorAll('.wallet-action').forEach(button => {
          button.addEventListener('click', async () => {
            const kind = button.dataset.kind;
            await fetch(`${API_BASE}/api/admin/users/${button.dataset.id}/wallet`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify({ amountCents: 25000, type: kind, note: kind === 'topup' ? 'Vendor wallet top-up' : 'Vendor wallet refund' })
            });
            loadPage();
          });
        });
      }

      async function loadPage() {
        const [vendorsRes, ordersRes, payoutsRes] = await Promise.all([
          fetch(`${API_BASE}/api/admin/users?role=vendor`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${API_BASE}/api/admin/orders`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`${API_BASE}/api/admin/payouts`, { headers: { Authorization: `Bearer ${token}` } })
        ]);

        const vendors = await vendorsRes.json();
        const orders = await ordersRes.json();
        const payouts = await payoutsRes.json();

        renderStats(vendors, orders);
        renderActivity(vendors, payouts);
        renderVendors(vendors);
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('laundry-admin-token');
        window.location.href = '/login';
      });
      document.getElementById('adminLabel').textContent = 'Admin';
      loadPage();
    </script>
  </body>
</html>
