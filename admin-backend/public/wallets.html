<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallets</title>
    <style>
      :root {
        --bg: #edf4ff;
        --sidebar: #0b1220;
        --panel: rgba(255,255,255,0.82);
        --muted: #5f6f8d;
        --text: #111827;
        --heading: #0f172a;
        --accent: #2bb4a3;
        --accent-2: #4f7cff;
        --warning: #ffb648;
        --danger: #f26a6a;
        --border: rgba(15, 23, 42, 0.08);
        --shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #edf4ff 0%, #f8faff 100%);
      }

      .shell { display: flex; min-height: 100vh; }
      .sidebar {
        width: 260px;
        background: linear-gradient(180deg, #0b1220 0%, #101b2d 100%);
        color: #edf5ff;
        border-right: 1px solid rgba(255,255,255,0.06);
        padding: 28px 18px;
      }
      .brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
        margin-bottom: 30px; padding: 4px 8px 18px;
      }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06131b; font-weight: 900;
      }
      nav { display: flex; flex-direction: column; gap: 10px; }
      .nav-item {
        text-decoration: none; color: rgba(255,255,255,0.75); border: 1px solid transparent; background: rgba(255,255,255,0.02);
        padding: 12px 14px; border-radius: 12px; display: block; transition: all 0.2s ease; font-weight: 600;
      }
      .nav-item:hover { background: rgba(255,255,255,0.05); }
      .nav-item.active {
        background: linear-gradient(90deg, rgba(79,124,255,0.18), rgba(43,180,163,0.14));
        border-color: rgba(127, 186, 255, 0.3); color: #f5f9ff;
      }
      .content { flex: 1; padding: 32px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      .eyebrow {
        color: var(--muted); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;
      }
      .title { font-size: clamp(1.8rem, 2.5vw, 2.5rem); letter-spacing: -0.05em; margin: 0; color: var(--heading); }
      .chip {
        border: 1px solid var(--border); background: rgba(255,255,255,0.6); padding: 9px 14px; border-radius: 999px;
        color: var(--muted); font-weight: 600; box-shadow: rgba(15,23,42,0.03) 0 8px 18px;
      }
      .logout {
        background: #ffffff; border: 1px solid var(--border); color: var(--text); padding: 11px 16px; border-radius: 12px;
        cursor: pointer; font-weight: 700;
      }
      .table-card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 22px; padding: 18px; box-shadow: var(--shadow);
      }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--border); }
      th {
        color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
      }
      tbody tr:hover { background: rgba(79,124,255,0.02); }
      .status-badge {
        border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; display: inline-block;
      }
      .topup { background: rgba(43,180,163,0.12); color: #0d9d86; }
      .refund { background: rgba(242,106,106,0.12); color: #d64747; }
      .muted { color: var(--muted); }
      @media (max-width: 900px) {
        .shell { flex-direction: column; }
        .sidebar { width: 100%; }
        .content { padding: 20px 16px 28px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">L</div> Laundry Ops</div>
        <nav>
          <a class="nav-item" href="/dashboard">Overview</a>
          <a class="nav-item" href="/kyc">KYC</a>
          <a class="nav-item" href="/orders">Orders</a>
          <a class="nav-item" href="/vendors">Vendors</a>
          <a class="nav-item" href="/drivers">Drivers</a>
          <a class="nav-item" href="/payouts">Payouts</a>
          <a class="nav-item active" href="/wallets">Wallets</a>
        </nav>
      </aside>

      <main class="content">
        <div class="topbar">
          <div>
            <span class="eyebrow">Operations</span>
            <h1 class="title">Wallet events</h1>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="chip" id="adminLabel">Admin</div>
            <button class="logout" id="logoutBtn">Logout</button>
          </div>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Note</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="walletRows"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:4001';
      const token = localStorage.getItem('laundry-admin-token');
      if (!token) { window.location.href = '/login'; }

      function formatMoney(cents) {
        return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format((cents || 0) / 100);
      }

      async function loadWallets() {
        const res = await fetch(`${API_BASE}/api/admin/wallet-events`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const rows = await res.json();
        const tbody = document.getElementById('walletRows');
        tbody.innerHTML = rows.map(item => `
          <tr>
            <td>${item.user_name || item.userName || 'User'}</td>
            <td><span class="status-badge ${item.type === 'refund' ? 'refund' : 'topup'}">${item.type}</span></td>
            <td>${formatMoney(item.amount_cents || item.amountCents || 0)}</td>
            <td>${item.note || 'Wallet adjustment'}</td>
            <td>${new Date(item.created_at || item.createdAt).toLocaleString()}</td>
          </tr>
        `).join('');
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('laundry-admin-token');
        window.location.href = '/login';
      });

      document.getElementById('adminLabel').textContent = 'Admin';
      loadWallets();
    </script>
  </body>
</html>
